[project]
name = "musafir"
version = "0.2.0"
description = "A small, self-hostable general web search engine: BM25 + embeddings, PageRank, rank fusion, cross-encoder reranking."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "mwparserfromhell==0.7.2",
    "trafilatura==2.3.1",
    "torch==2.15.0",
    "sentence-transformers==6.3.0",
    "numpy==2.5.4",
    "fastapi==0.163.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.14.0"]

[project.scripts]
musafir = "musafir.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
musafir = ["crawl/seeds.txt", "crawl/video_topics.txt", "search/queries.jsonl", "server/static/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends(...) in default arguments is the intended style

[tool.pytest.ini_options]
testpaths = ["tests"]
