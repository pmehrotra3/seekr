# Serve:  docker compose up -d --build     then open http://localhost:8000
# Needs:  data/serve.db and its snapshot files (seekr export data/serve.db)
# Keys:   docker compose exec seekr seekr keys create NAME
services:
  seekr:
    build: .
    ports:
      - "127.0.0.1:${SEEKR_HOST_PORT:-8000}:8000"  # localhost only: put a reverse proxy or tunnel in front
    volumes:
      - ./data:/app/data  # the index stays on your disk, outside the container
    environment:
      SEEKR_LOG_LEVEL: INFO
    restart: unless-stopped
